name: FluteModes
options:
  bundleIdPrefix: com.seagomezar
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2" # 1 = iPhone, 2 = iPad
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEVELOPMENT_TEAM: "QWY6U4KSA6"
    CODE_SIGN_STYLE: "Automatic"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"

targets:
  FluteModes:
    type: application
    platform: iOS
    sources:
      - path: FluteModes
    info:
      path: FluteModes/App/Info.plist
      properties:
        CFBundleDisplayName: "FluteModes"
        ITSAppUsesNonExemptEncryption: false
        UILaunchStoryboardName: "LaunchScreen"
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.seagomezar.flutemodes
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "3"
      ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
      DEVELOPMENT_TEAM: "QWY6U4KSA6"
      CODE_SIGN_STYLE: "Automatic"
